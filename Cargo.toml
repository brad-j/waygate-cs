[package]
name = "waygate-cs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A terminal board for your Claude Code sessions: find, read and resume them."
readme = "README.md"
repository = "https://github.com/brad-j/waygate-cs"
keywords = ["claude", "claude-code", "tui", "terminal", "sessions"]
categories = ["command-line-utilities"]

[[bin]]
name = "waygate-cs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
nucleo-matcher = "0.3"
ratatui = "0.30"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tachyonfx = { version = "0.25", default-features = false, features = ["std"] }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
